[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-sheet-extractor-editor"
version = "0.6.2"
description = "Extract, edit, and repack sprite sheets and texture atlases."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
authors = [{ name = "sprite-sheet-extractor-editor contributors" }]
dependencies = [
    "Pillow>=10.3.0",
    "numpy>=1.26.4",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-qt>=4.4.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
spritesheet = "spritesheet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["spritesheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"